                  "category_order": ["Федеральные","Новостные","Региональные","Кино","Сериалы","Сериалы НТВ","Спорт","Познавательные","Документальные","Музыкальные","Развлекательные","Религиозные","Радио","Разное"],
                  "category_emoji": {"Федеральные":"📡","Новостные":"📰","Региональные":"🏙","Кино":"🎬","Сериалы":"📺","Сериалы НТВ":"🎞","Спорт":"⚽","Познавательные":"🌍","Документальные":"🎥","Музыкальные":"🎵","Развлекательные":"🎭","Религиозные":"🙏","Радио":"📻","Разное":"📦"},
