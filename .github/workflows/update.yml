                      f"- EPG: `{active_epg}`", ""]
            with open("README.md", "w", encoding="utf-8") as f:
                f.write("\n".join(lines))

        def main():
            print("Loading EPG map...")
            by_name, by_translit, by_prefix, icons = load_epg_map()
            print(f"   by_name={len(by_name)} by_translit={len(by_translit)} by_prefix={len(by_prefix)} icons={len(icons)}")

            api_cats, api_names, country_by_id = load_api()
            whitelist = load_whitelist()

            all_channels = []
            for src in SOURCES:
                print(f"Downloading {src['name']}...")
                m3u = download_file(src["url"])
                if not m3u:
                    print(f"   Failed: {src['url']}")
                    continue
                parsed = parse_m3u(m3u, by_name, by_translit, by_prefix, icons, api_cats, api_names, country_by_id, src["name"], src["priority"])
                print(f"   {src['name']}: {len(parsed)} channels")
                all_channels.extend(parsed)

            if whitelist:
                all_channels.extend(whitelist)
                print(f"   Whitelist added: {len(whitelist)} channels")

            total_raw = len(all_channels)
            print(f"Total before dedup: {total_raw}")
            print(f"Filtered: child={filter_stats['child']}, trash={filter_stats['trash']}, name_delete={filter_stats['name_delete']}, trash_url={filter_stats['trash_url']}, blocked_id={filter_stats['blocked_id']}, blocked_country={filter_stats['blocked_country']}")
            deduped = dedup(all_channels)
            total_dedup = len(deduped)
            print(f"After dedup: {total_dedup}")

            print("Loading cache...")
            cache = load_cache()

            print("Checking streams...")
            with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                results = list(tqdm(ex.map(lambda c: check_stream(c, cache), deduped), total=total_dedup))
            valid = [c for c in results if c is not None]
            cache_hits = sum(1 for c in valid if c.get("from_cache"))
            valid.sort(key=sort_key)

            valid_urls = {c["url"] for c in valid if not c.get("is_whitelist")}
            cache = {k: v for k, v in cache.items() if k in valid_urls}
            save_cache(cache)

            ua_stats = {}
            for c in valid:
                if c.get("is_whitelist"):
                    continue
                n = c.get("working_ua_name", "Unknown")
                ua_stats[n] = ua_stats.get(n, 0) + 1

            print("Saving M3U...")
            with open(OUTPUT_M3U, "w", encoding="utf-8") as f:
                f.write(f'#EXTM3U url-tvg="{EPG_HEADER}" x-tvg-url="{EPG_HEADER}"\n')
                for ch in valid:
                    f.write(f"{ch['inf']}\n")
                    f.write(f"#EXTVLCOPT:http-user-agent={ch['working_ua']}\n")
                    f.write(f"{ch['url']}\n")

            generate_readme(valid, total_raw, total_dedup, EPG_HEADER, ua_stats, cache_hits, len(whitelist))
            print(f"Done: {len(valid)} live channels (cache hits: {cache_hits}, whitelist: {len(whitelist)})")

        if __name__ == "__main__":
            main()
        PYEOF

    - name: Run parser
      run: python main.py

    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add clean_sorted_channels.m3u README.md
        git add cache.json epg_map.json 2>/dev/null || true
        git commit -m "Auto-update playlist" || echo "No changes"
        git push
