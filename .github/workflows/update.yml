        def detect_encoding(raw_bytes):
            head = raw_bytes[:500].lower()
            if b'encoding="windows-1251"' in head or b"encoding='windows-1251'" in head:
                return 'windows-1251'
            if b'encoding="cp1251"' in head or b"encoding='cp1251'" in head:
                return 'cp1251'
            return 'utf-8'

        def download_file(url, gz=False):
            try:
                r = requests.get(url, headers={"User-Agent": FAKE_BROWSER_UA}, timeout=(10, 180), stream=True)
                r.raise_for_status()
                content = r.content
                if content[:2] == b'\x1f\x8b' or gz:
                    try:
                        content = gzip.decompress(content)
                    except Exception:
                        pass
                enc = detect_encoding(content)
                if enc != 'utf-8':
                    print(f"      encoding: {enc}")
                return content.decode(enc, errors='replace')
            except Exception as e:
                print(f"   warn: {url} -> {e}")
                return None

        def normalize_v2(name):
            if not name:
                return ""
            n = name.lower()
            n = re.sub(r'\(.*?\)|\[.*?\]', ' ', n)
            n = n.replace('ё', 'е').replace('й', 'и')
            n = re.sub(r'[^а-яa-z0-9\s]', ' ', n)
            words = n.split()
            words = [w for w in words if w and w not in NOISE_WORDS]
            return " ".join(words)

        def translit(s):
            if not s:
                return ""
            out = []
            for ch in s:
                if ch in TRANSLIT:
                    out.append(TRANSLIT[ch])
                else:
                    out.append(ch)
            return "".join(out)

        def build_epg_map(xml_text):
            by_name = {}
            by_translit = {}
            by_prefix = {}
            icons = {}
            if not xml_text:
                return by_name, by_translit, by_prefix, icons
            try:
                stream = io.BytesIO(xml_text.encode('utf-8'))
                count = 0
                for event, elem in ET.iterparse(stream, events=('end',)):
                    if elem.tag == 'channel':
                        cid = elem.get('id')
                        if cid:
                            icon_url = ""
                            icon_el = elem.find('icon')
                            if icon_el is not None:
                                icon_url = icon_el.get('src', '')
                            if icon_url:
                                icons[cid] = icon_url
                            for dn in elem.findall('display-name'):
                                if dn.text:
                                    norm = normalize_v2(dn.text)
                                    if norm and len(norm) >= 2:
                                        if norm not in by_name:
                                            by_name[norm] = cid
                                        tr = translit(norm)
                                        if tr and tr not in by_translit:
                                            by_translit[tr] = cid
                                        pfx = norm[:5]
                                        if len(pfx) >= 3:
                                            by_prefix.setdefault(pfx, [])
                                            if (norm, cid) not in by_prefix[pfx]:
                                                by_prefix[pfx].append((norm, cid))
                        elem.clear()
                        count += 1
                print(f"   EPG parsed: {count} channels")
            except Exception as e:
                print(f"   XMLTV err: {e}")
            return by_name, by_translit, by_prefix, icons

        def load_epg_map():
            if os.path.exists(EPG_MAP_FILE):
                try:
                    with open(EPG_MAP_FILE, encoding="utf-8") as f:
                        data = json.load(f)
                    if data.get("version") == EPG_MAP_VERSION:
                        age = time.time() - data.get("ts", 0)
                        if age < EPG_MAP_TTL:
                            print(f"   EPG map from cache (age: {int(age/3600)}h)")
                            epg_stats["from_cache"] = 1
                            return (
                                data.get("by_name", {}),
                                data.get("by_translit", {}),
                                {k: [tuple(x) for x in v] for k, v in data.get("by_prefix", {}).items()},
                                data.get("icons", {}),
                            )
                except Exception as e:
                    print(f"   cache err: {e}")
            print(f"   Downloading EPG: {EPG_URL}")
            xml_text = download_file(EPG_URL, gz=True)
            if not xml_text:
                print(f"   Fallback: {EPG_URL_FALLBACK}")
                xml_text = download_file(EPG_URL_FALLBACK, gz=True)
            if not xml_text:
                print("   EPG unavailable")
                return {}, {}, {}, {}
            by_name, by_translit, by_prefix, icons = build_epg_map(xml_text)
            print(f"   EPG: {len(by_name)} names, {len(by_translit)} translit, {len(icons)} icons, {len(by_prefix)} prefixes")
            try:
                with open(EPG_MAP_FILE, "w", encoding="utf-8") as f:
                    json.dump({
                        "version": EPG_MAP_VERSION,
                        "ts": int(time.time()),
                        "by_name": by_name,
                        "by_translit": by_translit,
                        "by_prefix": {k: list(v) for k, v in by_prefix.items()},
                        "icons": icons,
                    }, f, ensure_ascii=False)
            except Exception as e:
                print(f"   save err: {e}")
            return by_name, by_translit, by_prefix, icons

        def resolve_epg_id(name, by_name, by_translit, by_prefix):
            norm = normalize_v2(name)
            if not norm:
                return "", ""
            if norm in by_name:
                return by_name[norm], "by_name"
            tr = translit(norm)
            if tr and tr in by_translit:
                return by_translit[tr], "by_translit"
            pfx = norm[:5]
            if len(pfx) >= 3 and pfx in by_prefix:
                candidates = by_prefix[pfx]
                if len(candidates) <= 3:
                    return candidates[0][1], "by_prefix"
            return "", "no_match"

        def load_api():
            cats = {}
            names_index = {}
            country_by_id = {}
            print(f"   Loading API: {API_CHANNELS}")
            txt = download_file(API_CHANNELS)
            if not txt:
                return cats, names_index, country_by_id
            try:
                data = json.loads(txt)
                for ch in data:
                    cid = ch.get("id")
                    ch_cats = ch.get("categories", []) or []
                    ch_name = ch.get("name", "")
                    alt_names = ch.get("alt_names", []) or []
                    country = ch.get("country", "")
                    if cid and country:
                        country_by_id[cid] = country
                    if cid and ch_cats:
                        for c in ch_cats:
                            mapped = API_CATEGORY_MAP.get(c.lower())
                            if mapped:
                                cats[cid] = mapped
                                break
                    if cid:
                        if ch_name:
                            names_index[normalize_v2(ch_name)] = cid
                        for alt in alt_names:
                            if alt:
                                names_index[normalize_v2(alt)] = cid
                print(f"   API: cats={len(cats)}, names={len(names_index)}, countries={len(country_by_id)}")
            except Exception as e:
                print(f"   API err: {e}")
            return cats, names_index, country_by_id

        def clean_url(url):
            p = urlparse(url)
            return f"{p.scheme}://{p.netloc}{p.path}".strip().lower()

        def has_hd_marker(name):
            return bool(re.search(r'\b(hd|fhd|uhd|4k|1080|720|full hd)\b', name.lower()))

        def is_trash_url(url):
            if not url.lower().startswith("http"):
                return True
            u = url.lower()
            if "cinerama" in u:
                return True
            p = urlparse(url)
            host = p.netloc.lower().split(":")[0]
            if re.match(r'^\d{1,3}(\.\d{1,3}){3}$', host):
                return True
            if host in BAD_DOMAINS_EXACT:
                return True
            for bad in BAD_DOMAINS_SUFFIX:
                if host == bad or host.endswith("." + bad):
                    return True
            path_lower = p.path.lower()
            for ext in BAD_EXTENSIONS:
                if path_lower.endswith(ext):
                    return True
            for port in BAD_PORTS:
                if port in u:
                    return True
            return False

        def in_list(zone, lst):
            return any(b in zone for b in lst)

        def determine_group_from_name(orig_group, clean_name):
            z = f"{clean_name} {orig_group.lower()}"
            for target, kws in GENRE_MAP.items():
                for kw in kws:
                    if kw in z:
                        return target
            return ""

        def parse_attr(line, attr):
            m = re.search(rf'{attr}="([^"]*)"', line)
            return m.group(1) if m else ""

        def load_whitelist():
            repo_env = os.getenv("GITHUB_REPOSITORY", "")
            if "/" not in repo_env:
                return []
            user, repo = repo_env.split("/", 1)
            url = f"https://raw.githubusercontent.com/{user}/{repo}/main/{WHITELIST_FILE}"
            print(f"   Loading whitelist: {url}")
            content = download_file(url)
            if not content:
                print("   Whitelist not found, skip")
                return []
            channels = []
            current_inf = ""
            for raw in content.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    current_inf = line
                    continue
                if line.startswith("#"):
                    continue
                if not current_inf:
                    continue
                name_match = current_inf.rsplit(",", 1)[-1].strip()
                orig_tvg_id = parse_attr(current_inf, "tvg-id")
                orig_tvg_name = parse_attr(current_inf, "tvg-name") or name_match
                orig_group = parse_attr(current_inf, "group-title") or "📌 Мои каналы"
                orig_logo = parse_attr(current_inf, "tvg-logo")
                new_inf = (f'#EXTINF:-1 tvg-id="{orig_tvg_id}" tvg-name="{orig_tvg_name}" '
                           f'tvg-logo="{orig_logo}" group-title="{orig_group}",{name_match}')
                channels.append({
                    "inf": new_inf, "url": line, "name": name_match,
                    "clean_name": normalize_v2(name_match),
                    "tvg_id": orig_tvg_id,
                    "group": orig_group, "base_group": orig_group,
                    "source_priority": -1, "is_whitelist": True,
                    "working_ua": USER_AGENTS[0][1],
                    "working_ua_name": USER_AGENTS[0][0],
                })
                current_inf = ""
            print(f"   Whitelist channels: {len(channels)}")
            return channels

        def parse_m3u(content, by_name, by_translit, by_prefix, icons, api_cats, api_names, country_by_id, source_name="", source_priority=0):
            channels = []
            current_inf = ""
            extgrp = ""
            total_seen = 0
            api_used = 0
            override_used = 0
            name_override_used = 0
            epg_used = 0
            samples = []
            for raw in content.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    current_inf = line
                    extgrp = ""
                    continue
                if line.startswith("#EXTGRP:"):
                    extgrp = line.split(":", 1)[1].strip()
                    continue
                if line.startswith("#"):
                    continue
                if not current_inf:
                    continue
                total_seen += 1
                name_match = current_inf.rsplit(",", 1)[-1].strip()
                clean_name = normalize_v2(name_match)
                orig_tvg_id = parse_attr(current_inf, "tvg-id")
                orig_tvg_name = parse_attr(current_inf, "tvg-name") or name_match
                orig_group = parse_attr(current_inf, "group-title") or extgrp or "Разное"
                orig_logo = parse_attr(current_inf, "tvg-logo")

                z = f"{clean_name} {orig_group.lower()}"

                # 1. DELETE по имени
                if clean_name in NAME_GROUP_OVERRIDES and NAME_GROUP_OVERRIDES[clean_name] == "DELETE":
                    filter_stats["name_delete"] += 1
                    current_inf = ""
                    continue

                # 2. Детские
                if in_list(z, CHILD_BLACKLIST):
                    filter_stats["child"] += 1
                    current_inf = ""
                    continue

                # 3. Мусор
                if in_list(z, TRASH_BLACKLIST):
                    filter_stats["trash"] += 1
                    current_inf = ""
                    continue

                # 4. Битые URL
                if is_trash_url(line):
                    filter_stats["trash_url"] += 1
                    current_inf = ""
                    continue

                base_id = orig_tvg_id.split("@")[0] if orig_tvg_id else ""

                # 5. По ID
                if base_id and base_id in BLOCKED_TVG_IDS:
                    filter_stats["blocked_id"] += 1
                    current_inf = ""
                    continue

                # 6. По стране
                country = country_by_id.get(base_id)
                if not country:
                    found_id = api_names.get(clean_name)
                    if found_id:
                        country = country_by_id.get(found_id)
                if country and country in BLOCKED_COUNTRIES:
                    filter_stats["blocked_country"] += 1
                    current_inf = ""
                    continue
                if base_id:
                    bl = base_id.lower()
                    if bl.endswith(tuple(BLOCKED_SUFFIXES)):
                        filter_stats["blocked_country"] += 1
                        current_inf = ""
                        continue

                # 7. EPG
                epg_id, how = resolve_epg_id(name_match, by_name, by_translit, by_prefix)
                epg_stats[how] = epg_stats.get(how, 0) + 1
                if epg_id:
                    epg_used += 1
                if len(samples) < 6:
                    samples.append(f"{name_match[:25]} → {epg_id or '(removed)'} [{how}]")

                final_logo = orig_logo
                if not final_logo and epg_id and epg_id in icons:
                    final_logo = icons[epg_id]

                # 8. Категоризация
                base_group = ""
                if clean_name in NAME_GROUP_OVERRIDES:
                    base_group = NAME_GROUP_OVERRIDES[clean_name]
                    name_override_used += 1
                if not base_group and base_id and base_id in CATEGORY_OVERRIDES:
                    base_group = CATEGORY_OVERRIDES[base_id]
                    override_used += 1
                if not base_group and base_id and base_id in api_cats:
                    base_group = api_cats[base_id]
                    api_used += 1
                if not base_group:
                    found_id = api_names.get(clean_name)
                    if found_id and found_id in api_cats:
                        base_group = api_cats[found_id]
                        api_used += 1
                if not base_group:
                    base_group = determine_group_from_name(orig_group, clean_name)
                if not base_group:
                    base_group = "Разное"

                emoji = EMOJI.get(base_group, "📦")
                if has_hd_marker(name_match):
                    group = f"{emoji} {base_group} HD"
                else:
                    group = f"{emoji} {base_group}"

                final_tvg_id = epg_id if epg_id else ""
                new_inf = (f'#EXTINF:-1 tvg-id="{final_tvg_id}" tvg-name="{orig_tvg_name}" '
                           f'tvg-logo="{final_logo}" group-title="{group}",{name_match}')
                channels.append({
                    "inf": new_inf, "url": line, "name": name_match,
                    "clean_name": clean_name, "tvg_id": final_tvg_id,
                    "group": group, "base_group": base_group,
                    "source_priority": source_priority,
                })
                current_inf = ""
            print(f"   [{source_name}] Total seen: {total_seen}")
            print(f"   [{source_name}] API: {api_used}, overrides: {override_used}, name_overrides: {name_override_used}, EPG: {epg_used}")
            return channels

        def dedup(channels):
            channels.sort(key=lambda c: c["source_priority"])
            seen_url = set()
            out = []
            for ch in channels:
                u = clean_url(ch["url"])
                if u in seen_url:
                    continue
                seen_url.add(u)
                out.append(ch)
            return out

        def load_cache():
            if os.path.exists(CACHE_FILE):
                try:
                    with open(CACHE_FILE, encoding="utf-8") as f:
                        return json.load(f)
                except Exception:
                    return {}
            return {}

        def save_cache(cache):
            with open(CACHE_FILE, "w", encoding="utf-8") as f:
                json.dump(cache, f, ensure_ascii=False, indent=1)

        def check_stream(channel, cache):
            if channel.get("is_whitelist"):
                return channel
            url = channel["url"]
            now = int(time.time())
            if url in cache and now - cache[url].get("ts", 0) < CACHE_TTL:
                channel["working_ua"] = cache[url]["ua"]
                channel["working_ua_name"] = cache[url]["ua_name"]
                channel["from_cache"] = True
                return channel
            for ua_name, ua in USER_AGENTS:
                try:
                    with requests.get(url, headers={"User-Agent": ua}, timeout=TIMEOUT, stream=True, allow_redirects=True) as r:
                        if r.status_code != 200:
                            continue
                        chunk = None
                        for c in r.iter_content(chunk_size=1024):
                            chunk = c
                            break
                        if not chunk or len(chunk) < 16:
                            continue
                        head = chunk[:200].lower()
                        if (head.startswith(b'<!doctype') or head.startswith(b'<html')
                                or head.startswith(b'<head') or head.startswith(b'<?xml')):
                            continue
                        channel["working_ua"] = ua
                        channel["working_ua_name"] = ua_name
                        channel["from_cache"] = False
                        cache[url] = {"ua": ua, "ua_name": ua_name, "ts": now}
                        return channel
                except Exception:
                    continue
            return None

        def natural_key(s):
            return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', s)]

        def sort_key(ch):
            is_wl = 0 if ch.get("is_whitelist") else 1
            if ch.get("is_whitelist"):
                return (is_wl, 0, ch["group"].lower(), natural_key(ch["name"]))
            g = ch["group"]
            idx = CATEGORY_PRIORITY.index(g) if g in CATEGORY_PRIORITY else len(CATEGORY_PRIORITY)
            return (is_wl, idx, "", natural_key(ch["name"]))

