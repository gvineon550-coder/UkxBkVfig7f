name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

concurrency:
  group: iptv-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q aiohttp

      - name: Bootstrap config files
        run: |
          python - << 'PYEOF'
          import json, pathlib
          files = {
              "config.json": {
                  "concurrency": 100,
                  "http_timeout": 8,
                  "ffprobe_timeout": 8,
                  "ffprobe_probesize": 32768,
                  "ffprobe_analyzeduration": 1000000,
                  "auto_cleanup": True,
                  "auto_cleanup_ready_ratio": 0.7,
                  "max_consecutive_fails": 2,
                  "drop_categories": ["Религиозные", "Региональные"],
                  "epg_url": "https://iptvx.one/epg/epg_lite.xml.gz",
                  "epg_url_fallback": "http://iptvx.one/epg/epg_lite.xml.gz",
                  "epg_ttl_hours": 336,
                  "api_url": "https://iptv-org.github.io/api/channels.json",
                  "api_ttl_hours": 336,
                  "output_m3u": "clean_sorted_channels.m3u",
                  "whitelist_file": "whitelist.m3u",
                  "whitelist_groups_order": ["Kinowalk", "Rutube"],
                  "blocked_countries": ["UA"],
                  "ua_weights": {
                      "HlsWinkPlayer": 30, "Wink": 25, "TiviMate": 12, "AndroidTV": 8,
                      "VLC": 8, "SmartTV": 6, "Kodi": 5, "OTT": 5, "ExoPlayer": 4,
