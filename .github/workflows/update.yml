name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install deps
      run: pip install requests tqdm

    - name: Create main.py
      run: |
        cat > main.py << 'PYEOF'
        import os
        import re
        import json
        import time
        import gzip
        import requests
        import xml.etree.ElementTree as ET
        from tqdm import tqdm
        from concurrent.futures import ThreadPoolExecutor
        from urllib.parse import urlparse
        from datetime import datetime, timezone

        SOURCES = [
            {"url": "https://iptv-org.github.io/iptv/countries/ru.m3u", "name": "RU-Country", "priority": 0},
            {"url": "https://iptv-org.github.io/iptv/languages/rus.m3u", "name": "RU-Language", "priority": 1},
        ]

        EPG_SOURCES = [
            "https://iptvx.one/EPG_LITE",
            "https://iptvx.one/epg/epg_lite.xml.gz",
        ]

        API_CHANNELS = "https://iptv-org.github.io/api/channels.json"

        OUTPUT_M3U = "clean_sorted_channels.m3u"
        CACHE_FILE = "cache.json"
        CACHE_TTL = 7 * 24 * 3600
        TIMEOUT = 6.0
        MAX_WORKERS = 25

        USER_AGENTS = [
            ("TiviMate", "TiviMate/4.7.0 (Linux; Android 11; Sony Smart TV)"),
            ("Wink", "Wink/2.4.1 (Linux; Android 11; Sony Smart TV)"),
            ("ExoPlayer", "ExoPlayer/2.19.1 (Linux; Android 11)"),
            ("Chrome", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"),
            ("Kodi", "Kodi/20.5 (Windows NT 10.0; Win64; x64) App_Bitness/64 Version/20.5.0"),
        ]

        EMOJI = {
            "Кино": "🎬",
            "Сериалы": "📺",
            "Спорт": "⚽",
            "Познавательные": "🌍",
            "Документальные": "🎥",
            "Новостные": "📰",
            "Музыкальные": "🎵",
            "Развлекательные": "🎭",
            "Общие": "📡",
            "Разное": "📦",
        }

        BASE_GROUPS = list(EMOJI.keys())

        CATEGORY_PRIORITY = []
        for g in BASE_GROUPS:
            CATEGORY_PRIORITY.append(f"{EMOJI[g]} {g} HD")
            CATEGORY_PRIORITY.append(f"{EMOJI[g]} {g}")

        API_CATEGORY_MAP = {
            "movies": "Кино", "series": "Сериалы", "sports": "Спорт",
            "news": "Новостные", "documentary": "Документальные",
            "science": "Познавательные", "education": "Познавательные",
            "history": "Документальные", "culture": "Познавательные",
            "travel": "Познавательные", "music": "Музыкальные",
            "entertainment": "Развлекательные", "comedy": "Развлекательные",
            "general": "Общие", "business": "Новостные", "weather": "Новостные",
            "animation": "Разное", "kids": "Разное", "family": "Разное",
            "shopping": "Разное", "religious": "Разное",
            "lifestyle": "Развлекательные", "cooking": "Развлекательные",
            "auto": "Познавательные", "outdoor": "Познавательные",
            "relax": "Музыкальные", "classic": "Кино", "hobby": "Познавательные",
        }

        GENRE_MAP = {
            "Спорт": ["sport", "спорт", "football", "футбол", "матч", "боец", "arena", "арена", "golf", "eurosport", "extreme", "экстрим", "бокс", "boxing", "mma", "ufc", "хоккей", "hockey", "баскетбол", "basketball", "теннис", "tennis", "автоспорт", "motorsport"],
            "Кино": ["cinema", "кино", "фильм", "movie", "film", "action", "комедия", "дорама", "tv1000", "иллюзион", "shik", "хит", "premium", "премиум", "sony", "amc", "vh1", "paramount", "hbo", "fox", "thriller", "драма", "мелодрама", "киносерия", "кинохит", "русский роман", "русский детектив", "индийское кино"],
            "Сериалы": ["сериал", "series"],
            "Познавательные": ["science", "наука", "history", "история", "discovery", "nat geo", "гео", "travel", "путешествия", "культура", "документал", "animal planet", "wild", "nature", "природа", "планета", "24 техно", "в мире животных", "моя планета"],
            "Документальные": ["365 дней", "documental", "документ", "военная тайна", "national geographic", "tlc", "hgtv", "viasat explore", "viasat history", "viasat nature", "viju", "dmax", "охота", "рыбалка"],
            "Новостные": ["news", "новости", "известия", "euronews", "рбк", "rt", "вместе-рф", "мир 24", "москва 24", "360", "дождь", "forbes", "bloomberg", "cnbc", "россия 24"],
            "Музыкальные": ["music", "музык", "муз", "mtv", "vh1", "box", "ru.tv", "ру.тв", "tnt music", "тнт music", "europa plus", "европа плюс", "радио", "bridge", "mezzo", "russian music", "music box", "муз-тв", "muz", "шансон", "радио дача"],
            "Развлекательные": ["entertainment", "развлек", "тнт", "tnt", "пятница", "ю", "тв3", "тв-3", "продвижение", "че", "ю-тв", "юмор", "comedy", "тнт4", "комедия тв", "che", "friday", "пятница!", "суббота"],
            "Общие": ["первый", "россия", "мир", "тв центр", "отр", "звезда", "спас", "ртр", "rtr", "russia", "1tv", "1 канал", "5 канал", "пятый", "ren tv", "рен тв", "рен-тв", "твц", "стс", "sts", "домашний", "тв-21", "тв21"],
        }

        CHILD_BLACKLIST = ["детск", "child", "kids", "kid", "cartoon", "мульт", "nickelodeon", "nick jr", "карусель", "disney", "дисней", "baby", "tiptop", "гулли", "радость моя", "улыбка", "мультик", "детский", "юный", "школьник", "boomerang"]

        REGION_BLACKLIST = ["брянск", "калуга", "самара", "новосибирск", "красноярск", "омск", "челябинск", "уфа", "казань", "ростов", "волгоград", "пермь", "воронеж", "саратов", "тольятти", "ижевск", "барнаул", "иркутск", "хабаровск", "ярославль", "тюмень", "томск", "оренбург", "кемерово", "рязань", "астрахань", "пенза", "липецк", "тула", "чебоксары", "курск", "ставрополь", "сочи", "кубань", "регион", "губерния", "край", "осетия", "грозный", "архыз", "якутия", "югра", "колыма", "ямал", "енисей", "алтай", "бурят", "дагестан", "башкорт", "татарстан", "удмурт", "чуваш", "мордов", "марий", "коми", "карел"]

        TRASH_BLACKLIST = ["shop", "магазин", "ювелир", "leomax", "tts", "teleshop", "home shop", "top shop", "adult", "взрослый", "18+", "религ", "церков", "православ", "ислам", "мусульман", "иудей", "будд"]

        FOREIGN_MARKERS = ["german", "deutsch", "israel", "turkey", "turkish", "france", "french", "america", "arabic", "spanish", "italian", "poland", "polish", "ukrain", "belarus", "korea", "korean", "japan", "japanese", "china", "chinese", "india", "indian", "pakistan", "egypt", "al jazeera", "france 24", "bbc", "cnn"]

        BAD_DOMAINS_EXACT = ["localhost", "127.0.0.1"]
        BAD_DOMAINS_SUFFIX = [
            "cinerama.uz", "tektv.co", "procajaiptv.com", "videopne.co",
            "1iptv.xyz", "tptv.cz", "daddylive3.com", "rereyano.ru",
            "telestream.mom", "kondoplay.cfd", "iptvsupra.com", "d4ktv.info",
            "xemtv.net", "apollogrouptv.cam", "usaliveiptv.com",
            "streamseast.zip", "digitallizard-iptv.com", "iptvjoker.cloud",
            "4kliveiptv.io", "streamxyz.shop", "iptv-eldbert.xyz",
        ]

        FAKE_BROWSER_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

        filter_stats = {"child": 0, "region": 0, "trash": 0, "foreign": 0, "trash_url": 0}

        def download_file(url):
            try:
                r = requests.get(url, headers={"User-Agent": FAKE_BROWSER_UA}, timeout=25, stream=True)
                r.raise_for_status()
                content = r.content
                if content[:2] == b'\x1f\x8b':
                    content = gzip.decompress(content)
                return content.decode('utf-8', errors='replace')
            except Exception as e:
                print(f"   warn: {url} -> {e}")
                return None

        def download_epg():
            for url in EPG_SOURCES:
                print(f"   Probing EPG: {url}")
                txt = download_file(url)
                if txt and "<tv" in txt[:2000].lower():
                    print(f"   OK: {url}")
                    return txt, url
            return None, EPG_SOURCES[0]

        def load_api():
            cats = {}
            names_index = {}
            print(f"   Loading API: {API_CHANNELS}")
            txt = download_file(API_CHANNELS)
            if not txt:
                return cats, names_index
            try:
                data = json.loads(txt)
                for ch in data:
                    cid = ch.get("id")
                    ch_cats = ch.get("categories", []) or []
                    ch_name = ch.get("name", "")
                    alt_names = ch.get("alt_names", []) or []

                    if cid and ch_cats:
                        for c in ch_cats:
                            mapped = API_CATEGORY_MAP.get(c.lower())
                            if mapped:
                                cats[cid] = mapped
                                break

                    if cid:
                        if ch_name:
                            names_index[clean_channel_name(ch_name)] = cid
                        for alt in alt_names:
                            if alt:
                                names_index[clean_channel_name(alt)] = cid
                print(f"   API categories: {len(cats)}, name index: {len(names_index)}")
                sample_cats = list(cats.items())[:5]
                print(f"   API sample cats: {sample_cats}")
            except Exception as e:
                print(f"   API err: {e}")
            return cats, names_index

        def clean_url(url):
            p = urlparse(url)
            return f"{p.scheme}://{p.netloc}{p.path}".strip().lower()

        def has_hd_marker(name):
            return bool(re.search(r'\b(hd|fhd|uhd|4k|1080|720|full hd)\b', name.lower()))

        def clean_channel_name(name):
            n = name.lower()
            n = re.sub(r'\(.*?\)|\[.*?\]|hd|sd|fhd|4k|\.|\b(tv|тв)\b|\!|\+', '', n)
            return " ".join(n.split())

        def is_trash_url(url):
            if not url.lower().startswith("http"):
                return True
            p = urlparse(url)
            host = p.netloc.lower().split(":")[0]
            if re.match(r'^\d{1,3}(\.\d{1,3}){3}$', host):
                return True
            if host in BAD_DOMAINS_EXACT:
                return True
            for bad in BAD_DOMAINS_SUFFIX:
                if host == bad or host.endswith("." + bad):
                    return True
            if host.endswith(".local") or host.endswith(".test") or host.endswith(".example"):
                return True
            if p.path.lower().endswith((".html", ".php", ".asp", ".jsp")):
                return True
            return False

        def in_list(zone, lst):
            return any(b in zone for b in lst)

        def determine_group_from_name(orig_group, clean_name):
            z = f"{clean_name} {orig_group.lower()}"
            for target, kws in GENRE_MAP.items():
                for kw in kws:
                    if kw in z:
                        return target
            return ""

        def load_epg(xml_text):
            ids_map = {}
            if not xml_text:
                return ids_map
            try:
                root = ET.fromstring(xml_text)
                for ch in root.findall('channel'):
                    cid = ch.get('id')
                    if not cid:
                        continue
                    for dn in ch.findall('display-name'):
                        if dn.text:
                            ids_map[clean_channel_name(dn.text)] = cid
            except Exception as e:
                print(f"   XMLTV err: {e}")
            return ids_map

        def parse_attr(line, attr):
            m = re.search(rf'{attr}="([^"]*)"', line)
            return m.group(1) if m else ""

        def parse_m3u(content, ids_map, api_cats, api_names, source_name="", source_priority=0):
            channels = []
            current_inf = ""
            extgrp = ""
            total_seen = 0
            api_used = 0
            name_used = 0
            debug_ids = []
            for raw in content.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    current_inf = line
                    extgrp = ""
                    continue
                if line.startswith("#EXTGRP:"):
                    extgrp = line.split(":", 1)[1].strip()
                    continue
                if line.startswith("#"):
                    continue
                if not current_inf:
                    continue
                total_seen += 1
                name_match = current_inf.rsplit(",", 1)[-1].strip()
                clean_name = clean_channel_name(name_match)
                orig_tvg_id = parse_attr(current_inf, "tvg-id")
                orig_tvg_name = parse_attr(current_inf, "tvg-name") or name_match
                orig_group = parse_attr(current_inf, "group-title") or extgrp or "Разное"
                orig_logo = parse_attr(current_inf, "tvg-logo")

                z = f"{clean_name} {orig_group.lower()}"

                if in_list(z, CHILD_BLACKLIST):
                    filter_stats["child"] += 1
                    current_inf = ""
                    continue
                if source_name == "RU-Country" and in_list(z, REGION_BLACKLIST):
                    filter_stats["region"] += 1
                    current_inf = ""
                    continue
                if in_list(z, TRASH_BLACKLIST):
                    filter_stats["trash"] += 1
                    current_inf = ""
                    continue
                if source_name == "RU-Country" and any(fm in z for fm in FOREIGN_MARKERS):
                    filter_stats["foreign"] += 1
                    current_inf = ""
                    continue
                if is_trash_url(line):
                    filter_stats["trash_url"] += 1
                    current_inf = ""
                    continue

                tvg_id = orig_tvg_id or ids_map.get(clean_name, "")

                if len(debug_ids) < 5:
                    debug_ids.append(f"{name_match} → tvg={tvg_id or 'EMPTY'}")

                # ПРИОРИТЕТ: API по tvg_id → API по имени → угадывание
                base_group = ""
                if tvg_id and tvg_id in api_cats:
                    base_group = api_cats[tvg_id]
                    api_used += 1
                if not base_group:
                    found_id = api_names.get(clean_name)
                    if found_id and found_id in api_cats:
                        base_group = api_cats[found_id]
                        api_used += 1
                        name_used += 1
                if not base_group:
                    base_group = determine_group_from_name(orig_group, clean_name)
                if not base_group:
                    base_group = "Разное"

                emoji = EMOJI.get(base_group, "📦")
                if has_hd_marker(name_match):
                    group = f"{emoji} {base_group} HD"
                else:
                    group = f"{emoji} {base_group}"

                new_inf = (f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-name="{orig_tvg_name}" '
                           f'tvg-logo="{orig_logo}" group-title="{group}",{name_match}')
                channels.append({
                    "inf": new_inf, "url": line, "name": name_match,
                    "clean_name": clean_name, "tvg_id": tvg_id,
                    "group": group, "base_group": base_group,
                    "source_priority": source_priority,
                })
                current_inf = ""
            print(f"   [{source_name}] Total seen: {total_seen}")
            print(f"   [{source_name}] API used: {api_used} (by name: {name_used})")
            print(f"   [{source_name}] DEBUG samples:")
            for s in debug_ids:
                print(f"      {s}")
            return channels

        def dedup(channels):
            channels.sort(key=lambda c: c["source_priority"])
            seen_url = set()
            seen_key = set()
            out = []
            for ch in channels:
                u = clean_url(ch["url"])
                if u in seen_url:
                    continue
                key = ch["tvg_id"] if ch["tvg_id"] else f"name:{ch['clean_name']}"
                if key in seen_key:
                    continue
                seen_url.add(u)
                seen_key.add(key)
                out.append(ch)
            return out

        def load_cache():
            if os.path.exists(CACHE_FILE):
                try:
                    with open(CACHE_FILE, encoding="utf-8") as f:
                        return json.load(f)
                except Exception:
                    return {}
            return {}

        def save_cache(cache):
            with open(CACHE_FILE, "w", encoding="utf-8") as f:
                json.dump(cache, f, ensure_ascii=False, indent=1)

        def check_stream(channel, cache):
            url = channel["url"]
            now = int(time.time())
            if url in cache and now - cache[url].get("ts", 0) < CACHE_TTL:
                channel["working_ua"] = cache[url]["ua"]
                channel["working_ua_name"] = cache[url]["ua_name"]
                channel["from_cache"] = True
                return channel
            for ua_name, ua in USER_AGENTS:
                try:
                    with requests.get(url, headers={"User-Agent": ua}, timeout=TIMEOUT, stream=True, allow_redirects=True) as r:
                        if r.status_code != 200:
                            continue
                        ct = r.headers.get("Content-Type", "").lower()
                        if "text/html" in ct:
                            continue
                        for _ in r.iter_content(chunk_size=1024):
                            channel["working_ua"] = ua
                            channel["working_ua_name"] = ua_name
                            channel["from_cache"] = False
                            cache[url] = {"ua": ua, "ua_name": ua_name, "ts": now}
                            return channel
                except Exception:
                    continue
            return None

        def natural_key(s):
            return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', s)]

        def sort_key(ch):
            g = ch["group"]
            idx = CATEGORY_PRIORITY.index(g) if g in CATEGORY_PRIORITY else len(CATEGORY_PRIORITY)
            return (idx, natural_key(ch["name"]))

        def generate_readme(valid, total_raw, total_dedup, active_epg, ua_stats, cache_hits):
            stats = {}
            for g in BASE_GROUPS:
                stats[f"{EMOJI[g]} {g}"] = 0
                stats[f"{EMOJI[g]} {g} HD"] = 0
            with_epg = 0
            for ch in valid:
                stats[ch['group']] = stats.get(ch['group'], 0) + 1
                if ch["tvg_id"]:
                    with_epg += 1
            now_str = datetime.now(timezone.utc).strftime("%d.%m.%Y %H:%M UTC")
            repo_env = os.getenv("GITHUB_REPOSITORY", "")
            if "/" in repo_env:
                user, repo = repo_env.split("/", 1)
                pages_url = f"https://{user.lower()}.github.io/{repo.lower()}/{OUTPUT_M3U}"
            else:
                pages_url = f"https://YOUR_NICK.github.io/iptv/{OUTPUT_M3U}"
            lines = ["# IPTV Playlist", "", "Только русскоязычные каналы. Автообновление.", "", "## Dashboard",
                     f"- Updated: {now_str}",
                     f"- Total from source: {total_raw}",
                     f"- After dedup: {total_dedup}",
                     f"- Live channels: **{len(valid)}**",
                     f"- With EPG: {with_epg}",
                     f"- From cache: {cache_hits}",
                     f"- Active EPG: `{active_epg}`",
                     "", "## User-Agents", "", "| UA | Channels |", "| :--- | :---: |"]
            for name, count in sorted(ua_stats.items(), key=lambda x: -x[1]):
                lines.append(f"| {name} | {count} |")
            lines += ["", "## Categories", "", "| Category | Channels |", "| :--- | :---: |"]
            for g in BASE_GROUPS:
                lines.append(f"| {EMOJI[g]} {g} HD | {stats[f'{EMOJI[g]} {g} HD']} |")
                lines.append(f"| {EMOJI[g]} {g} | {stats[f'{EMOJI[g]} {g}']} |")
            lines += ["", "---", "", "## Links", "",
                      f"- Playlist: `{pages_url}`", f"- EPG: `{active_epg}`", ""]
            with open("README.md", "w", encoding="utf-8") as f:
                f.write("\n".join(lines))

        def main():
            print("Loading EPG...")
            epg_text, active_epg = download_epg()
            ids_map = load_epg(epg_text)
            print(f"   EPG channels: {len(ids_map)}")

            api_cats, api_names = load_api()

            all_channels = []
            for src in SOURCES:
                print(f"Downloading {src['name']}...")
                m3u = download_file(src["url"])
                if not m3u:
                    print(f"   Failed: {src['url']}")
                    continue
                parsed = parse_m3u(m3u, ids_map, api_cats, api_names, src["name"], src["priority"])
                print(f"   {src['name']}: {len(parsed)} channels")
                all_channels.extend(parsed)

            total_raw = len(all_channels)
            print(f"Total before dedup: {total_raw}")
            deduped = dedup(all_channels)
            total_dedup = len(deduped)
            print(f"After dedup: {total_dedup}")

            print("Loading cache...")
            cache = load_cache()

            print("Checking streams...")
            with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                results = list(tqdm(ex.map(lambda c: check_stream(c, cache), deduped), total=total_dedup))
            valid = [c for c in results if c is not None]
            cache_hits = sum(1 for c in valid if c.get("from_cache"))
            valid.sort(key=sort_key)

            valid_urls = {c["url"] for c in valid}
            cache = {k: v for k, v in cache.items() if k in valid_urls}
            save_cache(cache)

            ua_stats = {}
            for c in valid:
                n = c.get("working_ua_name", "Unknown")
                ua_stats[n] = ua_stats.get(n, 0) + 1

            print("Saving M3U...")
            with open(OUTPUT_M3U, "w", encoding="utf-8") as f:
                f.write(f'#EXTM3U url-tvg="{active_epg}" x-tvg-url="{active_epg}"\n')
                for ch in valid:
                    f.write(f"{ch['inf']}\n")
                    f.write(f"#EXTVLCOPT:http-user-agent={ch['working_ua']}\n")
                    f.write(f"{ch['url']}\n")

            generate_readme(valid, total_raw, total_dedup, active_epg, ua_stats, cache_hits)
            print(f"Done: {len(valid)} live channels (cache hits: {cache_hits})")

        if __name__ == "__main__":
            main()
        PYEOF

    - name: Run parser
      run: python main.py

    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add clean_sorted_channels.m3u README.md
        git add cache.json 2>/dev/null || true
        git commit -m "Auto-update playlist" || echo "No changes"
        git push
