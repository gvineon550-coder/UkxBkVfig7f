        def download_file(url):
            try:
                r = requests.get(url, headers={"User-Agent": FAKE_BROWSER_UA}, timeout=25, stream=True)
                r.raise_for_status()
                content = r.content
                if content[:2] == b'\x1f\x8b':
                    content = gzip.decompress(content)
                return content.decode('utf-8', errors='replace')
            except Exception as e:
                print(f"   warn: {url} -> {e}")
                return None

        def download_epg():
            for url in EPG_SOURCES:
                print(f"   Probing EPG: {url}")
                txt = download_file(url)
                if txt and "<tv" in txt[:2000].lower():
                    print(f"   OK: {url}")
                    return txt, url
            return None, EPG_SOURCES[0]

        def load_api():
            cats = {}
            names_index = {}
            country_by_id = {}
            print(f"   Loading API: {API_CHANNELS}")
            txt = download_file(API_CHANNELS)
            if not txt:
                return cats, names_index, country_by_id
            try:
                data = json.loads(txt)
                for ch in data:
                    cid = ch.get("id")
                    ch_cats = ch.get("categories", []) or []
                    ch_name = ch.get("name", "")
                    alt_names = ch.get("alt_names", []) or []
                    country = ch.get("country", "")
                    if cid and country:
                        country_by_id[cid] = country
                    if cid and ch_cats:
                        for c in ch_cats:
                            mapped = API_CATEGORY_MAP.get(c.lower())
                            if mapped:
                                cats[cid] = mapped
                                break
                    if cid:
                        if ch_name:
                            names_index[clean_channel_name(ch_name)] = cid
                        for alt in alt_names:
                            if alt:
                                names_index[clean_channel_name(alt)] = cid
                print(f"   API: cats={len(cats)}, names={len(names_index)}, countries={len(country_by_id)}")
            except Exception as e:
                print(f"   API err: {e}")
            return cats, names_index, country_by_id

        def clean_url(url):
            p = urlparse(url)
            return f"{p.scheme}://{p.netloc}{p.path}".strip().lower()

        def has_hd_marker(name):
            return bool(re.search(r'\b(hd|fhd|uhd|4k|1080|720|full hd)\b', name.lower()))

        def clean_channel_name(name):
            n = name.lower()
            n = re.sub(r'\(.*?\)|\[.*?\]|hd|sd|fhd|4k|\.|\b(tv|тв)\b|\!|\+', '', n)
            return " ".join(n.split())

        def is_trash_url(url):
            if not url.lower().startswith("http"):
                return True
            u = url.lower()
            if "cinerama" in u:
                return True
            p = urlparse(url)
            host = p.netloc.lower().split(":")[0]
            if re.match(r'^\d{1,3}(\.\d{1,3}){3}$', host):
                return True
            if host in BAD_DOMAINS_EXACT:
                return True
            for bad in BAD_DOMAINS_SUFFIX:
                if host == bad or host.endswith("." + bad):
                    return True
            if p.path.lower().endswith((".html", ".php", ".asp", ".jsp")):
                return True
            return False

        def in_list(zone, lst):
            return any(b in zone for b in lst)

        def determine_group_from_name(orig_group, clean_name):
            z = f"{clean_name} {orig_group.lower()}"
            for target, kws in GENRE_MAP.items():
                for kw in kws:
                    if kw in z:
                        return target
            return ""

        def load_epg(xml_text):
            """Строит три структуры:
               - by_id: {epg_id: [normalized_names]}
               - by_name: {normalized_name: epg_id}
               - all_names: [все нормализованные имена] для fuzzy
            """
            by_id = {}
            by_name = {}
            all_names = []
            if not xml_text:
                return by_id, by_name, all_names
            try:
                root = ET.fromstring(xml_text)
                for ch in root.findall('channel'):
                    cid = ch.get('id')
                    if not cid:
                        continue
                    names = []
                    for dn in ch.findall('display-name'):
                        if dn.text:
                            n = clean_channel_name(dn.text)
                            if n and len(n) >= 2:
                                names.append(n)
                                if n not in by_name:
                                    by_name[n] = cid
                                    all_names.append(n)
                    by_id[cid] = names
            except Exception as e:
                print(f"   XMLTV err: {e}")
            return by_id, by_name, all_names

        def find_epg_id(orig_tvg_id, orig_tvg_name, clean_name, epg_by_id, epg_by_name, epg_all_names):
            """Ищет EPG ID: точное по tvg_id → точное по имени → fuzzy."""
            # 1. Точное по tvg_id (без @)
            base = orig_tvg_id.split("@")[0] if orig_tvg_id else ""
            if base and base in epg_by_id:
                return base, "exact_id"
            # 2. Точное по имени (как оно есть)
            if clean_name in epg_by_name:
                return epg_by_name[clean_name], "exact_name"
            # 3. Точное по tvg_name
            if orig_tvg_name:
                cn2 = clean_channel_name(orig_tvg_name)
                if cn2 and cn2 in epg_by_name:
                    return epg_by_name[cn2], "exact_name"
            # 4. Fuzzy только для имён длиной >= 4
            if clean_name and len(clean_name) >= FUZZY_MIN_LEN:
                match = difflib.get_close_matches(clean_name, epg_all_names, n=1, cutoff=FUZZY_CUTOFF)
                if match:
                    return epg_by_name[match[0]], "fuzzy"
            return "", "none"

        def parse_attr(line, attr):
            m = re.search(rf'{attr}="([^"]*)"', line)
            return m.group(1) if m else ""

        def get_base_id(tvg_id):
            return tvg_id.split("@")[0] if tvg_id else ""

        def load_whitelist():
            repo_env = os.getenv("GITHUB_REPOSITORY", "")
            if "/" not in repo_env:
                print("   No GITHUB_REPOSITORY env, skip whitelist")
                return []
            user, repo = repo_env.split("/", 1)
            url = f"https://raw.githubusercontent.com/{user}/{repo}/main/{WHITELIST_FILE}"
            print(f"   Loading whitelist: {url}")
            content = download_file(url)
            if not content:
                print("   Whitelist not found or empty, skip")
                return []
            channels = []
            current_inf = ""
            for raw in content.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    current_inf = line
                    continue
                if line.startswith("#"):
                    continue
                if not current_inf:
                    continue
                name_match = current_inf.rsplit(",", 1)[-1].strip()
                orig_tvg_id = parse_attr(current_inf, "tvg-id")
                orig_tvg_name = parse_attr(current_inf, "tvg-name") or name_match
                orig_group = parse_attr(current_inf, "group-title") or "📌 Мои каналы"
                orig_logo = parse_attr(current_inf, "tvg-logo")
                new_inf = (f'#EXTINF:-1 tvg-id="{orig_tvg_id}" tvg-name="{orig_tvg_name}" '
                           f'tvg-logo="{orig_logo}" group-title="{orig_group}",{name_match}')
                channels.append({
                    "inf": new_inf, "url": line, "name": name_match,
                    "clean_name": clean_channel_name(name_match),
                    "tvg_id": orig_tvg_id,
                    "group": orig_group, "base_group": orig_group,
                    "source_priority": -1, "is_whitelist": True,
                    "working_ua": USER_AGENTS[0][1],
                    "working_ua_name": USER_AGENTS[0][0],
                })
                current_inf = ""
            print(f"   Whitelist channels: {len(channels)}")
            return channels

        def parse_m3u(content, epg_by_id, epg_by_name, epg_all_names, api_cats, api_names, country_by_id, source_name="", source_priority=0):
            channels = []
            current_inf = ""
            extgrp = ""
            total_seen = 0
            api_used = 0
            override_used = 0
            samples = []
            for raw in content.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    current_inf = line
                    extgrp = ""
                    continue
                if line.startswith("#EXTGRP:"):
                    extgrp = line.split(":", 1)[1].strip()
                    continue
                if line.startswith("#"):
                    continue
                if not current_inf:
                    continue
                total_seen += 1
                name_match = current_inf.rsplit(",", 1)[-1].strip()
                clean_name = clean_channel_name(name_match)
                orig_tvg_id = parse_attr(current_inf, "tvg-id")
                orig_tvg_name = parse_attr(current_inf, "tvg-name") or name_match
                orig_group = parse_attr(current_inf, "group-title") or extgrp or "Разное"
                orig_logo = parse_attr(current_inf, "tvg-logo")

                z = f"{clean_name} {orig_group.lower()}"

                if in_list(z, CHILD_BLACKLIST):
                    filter_stats["child"] += 1
                    current_inf = ""
                    continue
                if in_list(z, TRASH_BLACKLIST):
                    filter_stats["trash"] += 1
                    current_inf = ""
                    continue
                if any(fm in z for fm in FOREIGN_MARKERS):
                    filter_stats["foreign"] += 1
                    current_inf = ""
                    continue
                if is_trash_url(line):
                    filter_stats["trash_url"] += 1
                    current_inf = ""
                    continue

                base_id = get_base_id(orig_tvg_id)

                if base_id and base_id in BLOCKED_TVG_IDS:
                    filter_stats["blocked_id"] += 1
                    current_inf = ""
                    continue

                blocked = False
                country = country_by_id.get(base_id)
                if not country:
                    found_id = api_names.get(clean_name)
                    if found_id:
                        country = country_by_id.get(found_id)
                if country and country in BLOCKED_COUNTRIES:
                    blocked = True
                elif base_id:
                    bl = base_id.lower()
                    for suf in BLOCKED_SUFFIXES:
                        if bl.endswith(suf):
                            blocked = True
                            break
                if blocked:
                    filter_stats["blocked_country"] += 1
                    current_inf = ""
                    continue

                # === АВТОСОПОСТАВЛЕНИЕ EPG ===
                epg_id, how = find_epg_id(orig_tvg_id, orig_tvg_name, clean_name, epg_by_id, epg_by_name, epg_all_names)
                epg_stats[how] = epg_stats.get(how, 0) + 1
                if len(samples) < 5:
                    samples.append(f"{name_match[:25]} → {epg_id or '—'} ({how})")

                base_group = ""
                if base_id and base_id in CATEGORY_OVERRIDES:
                    base_group = CATEGORY_OVERRIDES[base_id]
                    override_used += 1
                if not base_group and base_id and base_id in api_cats:
                    base_group = api_cats[base_id]
                    api_used += 1
                if not base_group:
                    found_id = api_names.get(clean_name)
                    if found_id and found_id in api_cats:
                        base_group = api_cats[found_id]
                        api_used += 1
                if not base_group:
                    base_group = determine_group_from_name(orig_group, clean_name)
                if not base_group:
                    base_group = "Разное"

                emoji = EMOJI.get(base_group, "📦")
                if has_hd_marker(name_match):
                    group = f"{emoji} {base_group} HD"
                else:
                    group = f"{emoji} {base_group}"

                # tvg_id из EPG (совпадает с программой) или чистый без @
                final_tvg_id = epg_id if epg_id else base_id
                new_inf = (f'#EXTINF:-1 tvg-id="{final_tvg_id}" tvg-name="{orig_tvg_name}" '
                           f'tvg-logo="{orig_logo}" group-title="{group}",{name_match}')
                channels.append({
                    "inf": new_inf, "url": line, "name": name_match,
                    "clean_name": clean_name, "tvg_id": final_tvg_id,
                    "group": group, "base_group": base_group,
                    "source_priority": source_priority,
                })
                current_inf = ""
            print(f"   [{source_name}] Total seen: {total_seen}")
            print(f"   [{source_name}] API used: {api_used}, overrides: {override_used}")
            print(f"   [{source_name}] EPG match samples:")
            for s in samples:
                print(f"      {s}")
            return channels

        def dedup(channels):
            channels.sort(key=lambda c: c["source_priority"])
            seen_url = set()
            seen_key = set()
            out = []
            for ch in channels:
                u = clean_url(ch["url"])
                if u in seen_url:
                    continue
                key = ch["tvg_id"] if ch["tvg_id"] else f"name:{ch['clean_name']}"
                if key in seen_key:
                    continue
                seen_url.add(u)
                seen_key.add(key)
                out.append(ch)
            return out

        def load_cache():
            if os.path.exists(CACHE_FILE):
                try:
                    with open(CACHE_FILE, encoding="utf-8") as f:
                        return json.load(f)
                except Exception:
                    return {}
            return {}

        def save_cache(cache):
            with open(CACHE_FILE, "w", encoding="utf-8") as f:
                json.dump(cache, f, ensure_ascii=False, indent=1)

        def check_stream(channel, cache):
            if channel.get("is_whitelist"):
                return channel
            url = channel["url"]
            now = int(time.time())
            if url in cache and now - cache[url].get("ts", 0) < CACHE_TTL:
                channel["working_ua"] = cache[url]["ua"]
                channel["working_ua_name"] = cache[url]["ua_name"]
                channel["from_cache"] = True
                return channel
            for ua_name, ua in USER_AGENTS:
                try:
                    with requests.get(url, headers={"User-Agent": ua}, timeout=TIMEOUT, stream=True, allow_redirects=True) as r:
                        if r.status_code != 200:
                            continue
                        ct = r.headers.get("Content-Type", "").lower()
                        if "text/html" in ct:
                            continue
                        for _ in r.iter_content(chunk_size=1024):
                            channel["working_ua"] = ua
                            channel["working_ua_name"] = ua_name
                            channel["from_cache"] = False
                            cache[url] = {"ua": ua, "ua_name": ua_name, "ts": now}
                            return channel
                except Exception:
                    continue
            return None

        def natural_key(s):
            return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', s)]

        def sort_key(ch):
            is_wl = 0 if ch.get("is_whitelist") else 1
            if ch.get("is_whitelist"):
                return (is_wl, 0, ch["group"].lower(), natural_key(ch["name"]))
            g = ch["group"]
            idx = CATEGORY_PRIORITY.index(g) if g in CATEGORY_PRIORITY else len(CATEGORY_PRIORITY)
            return (is_wl, idx, "", natural_key(ch["name"]))

        def generate_readme(valid, total_raw, total_dedup, active_epg, ua_stats, cache_hits, wl_count):
            stats = {}
            for g in BASE_GROUPS:
                stats[f"{EMOJI[g]} {g}"] = 0
                stats[f"{EMOJI[g]} {g} HD"] = 0
            with_epg = 0
            wl_in_valid = 0
            for ch in valid:
                stats[ch['group']] = stats.get(ch['group'], 0) + 1
                if ch["tvg_id"]:
                    with_epg += 1
                if ch.get("is_whitelist"):
                    wl_in_valid += 1
            now_str = datetime.now(timezone.utc).strftime("%d.%m.%Y %H:%M UTC")
            repo_env = os.getenv("GITHUB_REPOSITORY", "")
            if "/" in repo_env:
                user, repo = repo_env.split("/", 1)
                pages_url = f"https://{user.lower()}.github.io/{repo.lower()}/{OUTPUT_M3U}"
            else:
                pages_url = f"https://YOUR_NICK.github.io/iptv/{OUTPUT_M3U}"
            lines = ["# IPTV Playlist", "", "Только русскоязычные каналы. Автообновление.", "", "## Dashboard",
                     f"- Updated: {now_str}",
                     f"- Total from source: {total_raw}",
                     f"- After dedup: {total_dedup}",
                     f"- Live channels: **{len(valid)}**",
                     f"- Whitelist channels: {wl_in_valid}",
                     f"- With EPG: {with_epg}",
                     f"- From cache: {cache_hits}",
                     f"- Active EPG: `{active_epg}`",
                     "", "## EPG Match Stats", "",
                     "| Method | Count |",
                     "| :--- | :---: |",
                     f"| Exact ID | {epg_stats.get('exact_id', 0)} |",
                     f"| Exact Name | {epg_stats.get('exact_name', 0)} |",
                     f"| Fuzzy | {epg_stats.get('fuzzy', 0)} |",
                     f"| No match | {epg_stats.get('none', 0)} |",
                     "", "## User-Agents", "", "| UA | Channels |", "| :--- | :---: |"]
            for name, count in sorted(ua_stats.items(), key=lambda x: -x[1]):
                lines.append(f"| {name} | {count} |")
            lines += ["", "## Categories", "", "| Category | Channels |", "| :--- | :---: |"]
            for g in BASE_GROUPS:
                lines.append(f"| {EMOJI[g]} {g} HD | {stats[f'{EMOJI[g]} {g} HD']} |")
                lines.append(f"| {EMOJI[g]} {g} | {stats[f'{EMOJI[g]} {g}']} |")
            extra_groups = {}
            for ch in valid:
                g = ch["group"]
                if g not in CATEGORY_PRIORITY and ch.get("is_whitelist"):
                    extra_groups[g] = extra_groups.get(g, 0) + 1
            if extra_groups:
                lines += ["", "### Из whitelist", "", "| Category | Channels |", "| :--- | :---: |"]
                for g, c in sorted(extra_groups.items(), key=lambda x: -x[1]):
                    lines.append(f"| {g} | {c} |")
            lines += ["", "---", "", "## Links", "",
                      f"- Playlist: `{pages_url}`", f"- EPG: `{active_epg}`", ""]
            with open("README.md", "w", encoding="utf-8") as f:
                f.write("\n".join(lines))

        def main():
            print("Loading EPG...")
            epg_text, active_epg = download_epg()
            epg_by_id, epg_by_name, epg_all_names = load_epg(epg_text)
            print(f"   EPG channels: {len(epg_by_id)}, unique names: {len(epg_all_names)}")
            print(f"   EPG sample IDs: {list(epg_by_id.keys())[:5]}")
            print(f"   EPG sample names: {epg_all_names[:5]}")

            api_cats, api_names, country_by_id = load_api()

            whitelist = load_whitelist()

            all_channels = []
            for src in SOURCES:
                print(f"Downloading {src['name']}...")
                m3u = download_file(src["url"])
                if not m3u:
                    print(f"   Failed: {src['url']}")
                    continue
                parsed = parse_m3u(m3u, epg_by_id, epg_by_name, epg_all_names, api_cats, api_names, country_by_id, src["name"], src["priority"])
                print(f"   {src['name']}: {len(parsed)} channels")
                all_channels.extend(parsed)

            if whitelist:
                all_channels.extend(whitelist)
                print(f"   Whitelist added: {len(whitelist)} channels")

            total_raw = len(all_channels)
            print(f"Total before dedup: {total_raw}")
            print(f"Filtered by country: {filter_stats['blocked_country']}")
            print(f"Filtered by ID: {filter_stats['blocked_id']}")
            print(f"EPG match: exact_id={epg_stats['exact_id']}, exact_name={epg_stats['exact_name']}, fuzzy={epg_stats['fuzzy']}, none={epg_stats['none']}")
            deduped = dedup(all_channels)
            total_dedup = len(deduped)
            print(f"After dedup: {total_dedup}")

            print("Loading cache...")
            cache = load_cache()

            print("Checking streams...")
            with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
                results = list(tqdm(ex.map(lambda c: check_stream(c, cache), deduped), total=total_dedup))
            valid = [c for c in results if c is not None]
            cache_hits = sum(1 for c in valid if c.get("from_cache"))
            valid.sort(key=sort_key)

            valid_urls = {c["url"] for c in valid if not c.get("is_whitelist")}
            cache = {k: v for k, v in cache.items() if k in valid_urls}
            save_cache(cache)

            ua_stats = {}
            for c in valid:
                if c.get("is_whitelist"):
                    continue
                n = c.get("working_ua_name", "Unknown")
                ua_stats[n] = ua_stats.get(n, 0) + 1

            print("Saving M3U...")
            with open(OUTPUT_M3U, "w", encoding="utf-8") as f:
                f.write(f'#EXTM3U url-tvg="{active_epg}" x-tvg-url="{active_epg}"\n')
                for ch in valid:
                    f.write(f"{ch['inf']}\n")
                    f.write(f"#EXTVLCOPT:http-user-agent={ch['working_ua']}\n")
                    f.write(f"{ch['url']}\n")

            generate_readme(valid, total_raw, total_dedup, active_epg, ua_stats, cache_hits, len(whitelist))
            print(f"Done: {len(valid)} live channels (cache hits: {cache_hits}, whitelist: {len(whitelist)})")

        if __name__ == "__main__":
            main()
        PYEOF

    - name: Run parser
      run: python main.py

    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add clean_sorted_channels.m3u README.md
        git add cache.json 2>/dev/null || true
        git commit -m "Auto-update playlist" || echo "No changes"
        git push
