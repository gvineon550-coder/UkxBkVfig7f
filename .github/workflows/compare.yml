name: Compare Playlists

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install deps
      run: pip install requests

    - name: Run compare
      run: |
        cat > compare.py << 'PYEOF'
        import requests
        import re
        from urllib.parse import urlparse

        THEIR_URL = "https://raw.githubusercontent.com/gvineon550-coder/8Z6evf3ezzM469/refs/heads/main/docs/all_checked.m3u8"
        OUR_URL = "https://raw.githubusercontent.com/gvineon550-coder/lindsben_iptv-/refs/heads/main/clean_sorted_channels.m3u"

        NOISE = re.compile(r'\b(тв|tv|hd|fhd|uhd|4k|1080|720|576|480|sd|канал|channel|online|live|stream|not|24/7)\b', re.IGNORECASE)

        def normalize(name):
            n = name.lower().strip()
            n = n.replace('ё', 'е').replace('й', 'и')
            n = re.sub(r'\(.*?\)|\[.*?\]', ' ', n)
            n = re.sub(r'[^а-яa-z0-9\s]', ' ', n)
            n = NOISE.sub(' ', n)
            return ' '.join(n.split())

        def parse_m3u(text):
            chans = []
            cur_name = None
            cur_group = None
            cur_url = None
            for raw in text.splitlines():
                line = raw.strip()
                if not line:
                    continue
                if line.startswith("#EXTINF:"):
                    # group-title
                    m = re.search(r'group-title="([^"]*)"', line)
                    cur_group = m.group(1) if m else ""
                    # name after last comma
                    cur_name = line.rsplit(",", 1)[-1].strip()
                    continue
                if line.startswith("#"):
                    continue
                if cur_name is not None:
                    chans.append({"name": cur_name, "group": cur_group, "url": line})
                    cur_name = None
                    cur_group = None
            return chans

        def norm_url(u):
            p = urlparse(u)
            return f"{p.scheme}://{p.netloc}{p.path}".strip().lower()

        print("Скачиваю их плейлист...")
        theirs_text = requests.get(THEIR_URL, timeout=60).text
        theirs = parse_m3u(theirs_text)
        print(f"   {len(theirs)} каналов")

        print("Скачиваю наш плейлист...")
        ours_text = requests.get(OUR_URL, timeout=60).text
        ours = parse_m3u(ours_text)
        print(f"   {len(ours)} каналов")

        # По URL
        their_urls = {norm_url(c["url"]) for c in theirs}
        our_urls = {norm_url(c["url"]) for c in ours}

        print("\n" + "=" * 60)
        print(f"URL ЕСТЬ У НИХ, НЕТ У НАС: {len(their_urls - our_urls)}")
        print("=" * 60)
        their_by_url = {norm_url(c["url"]): c for c in theirs}
        for u in sorted(their_urls - our_urls)[:200]:
            c = their_by_url[u]
            print(f"   {c['name'][:40]:40} | {c['group'][:20]:20} | {u[:80]}")

        print("\n" + "=" * 60)
        print(f"URL ЕСТЬ У НАС, НЕТ У НИХ: {len(our_urls - their_urls)}")
        print("=" * 60)
        our_by_url = {norm_url(c["url"]): c for c in ours}
        for u in sorted(our_urls - their_urls)[:200]:
            c = our_by_url[u]
            print(f"   {c['name'][:40]:40} | {c['group'][:20]:20} | {u[:80]}")

        # По нормализованному имени
        their_names = {}
        for c in theirs:
            n = normalize(c["name"])
            if n and n not in their_names:
                their_names[n] = c
        our_names = {}
        for c in ours:
            n = normalize(c["name"])
            if n and n not in our_names:
                our_names[n] = c

        print("\n" + "=" * 60)
        print(f"КАНАЛЫ ЕСТЬ У НИХ, НЕТ У НАС (по имени): {len(set(their_names) - set(our_names))}")
        print("=" * 60)
        for n in sorted(set(their_names) - set(our_names))[:200]:
            c = their_names[n]
            print(f"   {c['name'][:50]:50} | {c['group'][:25]}")

        print("\n" + "=" * 60)
        print(f"КАНАЛЫ ЕСТЬ У НАС, НЕТ У НИХ (по имени): {len(set(our_names) - set(their_names))}")
        print("=" * 60)
        for n in sorted(set(our_names) - set(their_names))[:300]:
            c = our_names[n]
            print(f"   {c['name'][:50]:50} | {c['group'][:25]}")
        PYEOF
        python compare.py
